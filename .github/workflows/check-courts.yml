name: Check Tennis Court Availability

# GitHub-hosted runners are blocked by Incapsula on the city site, so the
# calendar never mounts there. Keep this as a manual debug hook only.
# The live schedule runs on the Mac via launchd (scripts/install-macos-schedule.sh).
on:
  workflow_dispatch: {}

permissions:
  contents: write                # needed so the job can commit the updated state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run court check
        env:
          MIRAFLORES_USERNAME: ${{ secrets.MIRAFLORES_USERNAME }}
          MIRAFLORES_PASSWORD: ${{ secrets.MIRAFLORES_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node checkCourts.js

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: court-check-failure
          path: failure.png
          if-no-files-found: ignore

      - name: Commit updated state (if changed)
        run: |
          git config user.name "court-checker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update known-available state"
          git push
